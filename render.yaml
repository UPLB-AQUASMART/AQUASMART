services:
  - type: web
    name: aquasmart-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      rm -f bin/mf6 &&
      mkdir -p bin &&
      python -m flopy.utils.get_modflow bin --subset mf6 --quiet &&
      chmod +x bin/mf6
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MODFLOW_EXE
        value: bin/mf6
      - key: FRONTEND_ORIGIN
        value: https://aquasmart-frontend-tawny.vercel.app
